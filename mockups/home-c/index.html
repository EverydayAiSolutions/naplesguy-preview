<!doctype html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>The Naples Guy · Jeff Silberman</title>
<link rel="icon" href="assets/logo-no-senior-resources.png" type="image/png">
<style>
@font-face{font-family:"Cormorant Garamond";src:url("assets/fonts/cormorant-garamond-latin.woff") format("woff");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url("assets/fonts/cormorant-garamond-italic-latin.woff") format("woff");font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:Jost;src:url("assets/fonts/jost-latin.woff") format("woff");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --cream:#FBF7F0;--ivory:#FFFDF9;--sand:#F4ECDF;--line:#E9DFCF;
  --navy:#0E2A45;--navy2:#1B3A57;--ink:#22303B;--ink2:#4A5560;--mut:#7A7266;
  --teal:#0B7F8A;--tealdk:#096E77;
  --sh:0 1px 2px rgba(60,45,20,.05),0 10px 28px rgba(60,45,20,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--cream);color:var(--ink);font:400 16px/1.5 Jost,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input{font:inherit}
.serif{font-family:"Cormorant Garamond",Cormorant,serif}
h1,h2,h3{font-family:"Cormorant Garamond",Cormorant,serif;font-weight:500;letter-spacing:-.005em;color:var(--navy)}

/* Slim one-bar header: logo, phone once, menu. No utility bar, no footer chrome. */
.top{
  flex:none;
  background:var(--ivory);
  border-bottom:1px solid var(--line);
  position:relative;
  z-index:40;
}
.top .in{
  max-width:1440px;
  margin:0 auto;
  padding:8px 20px;
  min-height:64px;
  display:flex;
  align-items:center;
  gap:16px;
}
.brand{flex:none;display:flex;align-items:center}
.brand img{height:48px;width:auto}
.phone{
  flex:1;
  font:400 13.5px/1.3 Jost,sans-serif;
  color:var(--navy);
  letter-spacing:.01em;
  min-width:0;
}
.phone a{color:var(--navy);border-bottom:1px solid rgba(14,42,69,.35);padding-bottom:1px}
.phone a:hover,.phone a:focus-visible{color:var(--teal);border-bottom-color:var(--teal)}
.btn{
  flex:none;
  background:var(--teal);
  color:#fff;
  font:500 12px/1 Jost,sans-serif;
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:12px 20px;
  border-radius:999px;
  border:0;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
}
.btn:hover,.btn:focus-visible{background:var(--tealdk)}
.burger{
  flex:none;
  width:44px;height:44px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--ivory);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;
}
.burger span{display:block;width:18px;height:1.5px;background:var(--navy)}
#navt{position:absolute;opacity:0;pointer-events:none}
nav.menu{
  display:none;
  position:absolute;
  right:16px;top:calc(100% + 8px);
  background:var(--ivory);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--sh);
  padding:10px;
  min-width:260px;
  z-index:50;
}
#navt:checked ~ nav.menu{display:block}
nav.menu a{
  display:block;
  font:500 15px/1.25 Jost,sans-serif;
  letter-spacing:.04em;
  color:var(--navy);
  padding:12px 14px;
  border-radius:10px;
  min-height:44px;
}
nav.menu a:hover,nav.menu a:focus-visible{background:var(--sand)}
nav.menu .ask{margin-top:6px;text-align:center}

@media (max-width:799px){
  .top .in{padding:6px 14px 8px;min-height:62px;flex-wrap:wrap;gap:4px 12px}
  .brand img{height:42px}
  .phone{flex:1 1 100%;order:3;font-size:12.5px;padding:2px 0 2px 2px}
  .btn.desk{display:none}
}
@media (min-width:800px){
  .top .in{padding:0 28px;min-height:68px;gap:22px}
  .brand img{height:52px}
  .phone{font-size:14.5px}
}

/* Shared card arrow */
.go{
  width:28px;height:28px;border-radius:50%;
  background:var(--teal);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
a:hover .go,a:focus-visible .go{background:var(--tealdk)}

.page{height:100%;display:flex;flex-direction:column;background:var(--ivory)}
.lead{
  flex:none;
  text-align:center;
  padding:8px 16px 8px;
}
.lead .eyebrow{
  font:500 10.5px/1 Jost,sans-serif;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--mut);
}
.lead h1{font-size:28px;line-height:1.05;margin-top:4px;color:var(--navy)}
.tiles{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:8px;
  padding:0 10px 10px;
}
.tile{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  min-width:0;min-height:0;
  background:var(--sand);
  box-shadow:var(--sh);
}
.tile img{
  width:100%;height:100%;object-fit:cover;
  transform:scale(1.06);
  animation:kb 24s ease-in-out alternate infinite;
  transition:transform .8s ease;
}
.tile:nth-child(2) img{animation-delay:-6s;object-position:68% 28%}
.tile:nth-child(3) img{animation-delay:-12s;object-position:50% 55%}
.tile:nth-child(4) img{animation-delay:-18s;object-position:50% 45%}
.tile:hover img,.tile:focus-visible img{transform:scale(1.14);animation-play-state:paused}
@keyframes kb{
  from{transform:scale(1.06) translate(0,0)}
  to{transform:scale(1.16) translate(-1.2%,-1%)}
}
/* Light bottom scrim for the label only */
.tile .cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:28px 12px 12px;
  background:linear-gradient(180deg,rgba(14,42,69,0) 0%,rgba(14,42,69,.28) 55%,rgba(14,42,69,.46) 100%);
  color:#fff;
  display:flex;align-items:flex-end;justify-content:space-between;gap:8px;
}
.tile h2{
  color:#fff;
  font-size:22px;
  line-height:1.05;
  margin:0;
  text-shadow:0 1px 10px rgba(5,20,35,.4);
}
.tile .go{box-shadow:0 2px 8px rgba(5,20,35,.25)}

@media (min-width:800px){
  .lead{padding:10px 28px 8px}
  .lead h1{font-size:36px}
  .tiles{
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:1fr;
    gap:12px;
    padding:0 20px 18px;
  }
  .tile{border-radius:22px}
  .tile .cap{padding:48px 18px 18px}
  .tile h2{font-size:32px}
  .go{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){
  .tile img{animation:none;transform:scale(1.04)}
}
</style>
</head>
<body>
<div class="page">

<header class="top">
  <div class="in">
    <a class="brand" href="#" aria-label="The Naples Guy, Jeff Silberman">
      <picture>
        <source type="image/webp" srcset="assets/logo-no-senior-resources.webp">
        <img src="assets/logo-no-senior-resources.png" alt="The Naples Guy, Jeff Silberman" width="220" height="68">
      </picture>
    </a>
    <p class="phone">Call or Text Jeff at <a href="tel:+16095758626">609-575-8626</a></p>
    <a class="btn desk" href="#">Ask Jeff</a>
    <input type="checkbox" id="navt">
    <label class="burger" for="navt" aria-label="Menu"><span></span><span></span><span></span></label>
    <nav class="menu" aria-label="Menu">
      <a href="#">Family</a>
      <a href="#">Senior Living</a>
      <a href="#">Neighborhoods &amp; Real Estate</a>
      <a href="#">Amazon Holiday Deals</a>
      <a href="#">About Me</a>
      <a href="#">Weekend Email</a>
      <a class="btn ask" href="#">Ask Jeff</a>
    </nav>
  </div>
</header>

  <div class="lead">
    <p class="eyebrow">Naples · Florida</p>
    <h1>Your Naples Guide</h1>
  </div>
  <nav class="tiles" aria-label="Main sections">
    <a class="tile" href="#" aria-label="Family">
      <img src="assets/img/hero-child-running-beach.webp" alt="A child running along the shoreline on a bright day">
      <div class="cap"><h2>Family</h2><span class="go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
    </a>
    <a class="tile" href="#" aria-label="Senior Living">
      <img src="assets/img/hero-seniors-beach-joy.webp" alt="A smiling couple at the beach, the man giving the woman a piggyback ride in the surf">
      <div class="cap"><h2>Senior Living</h2><span class="go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
    </a>
    <a class="tile" href="#" aria-label="Neighborhoods and Real Estate">
      <img src="assets/img/hero-pool-lanai-canal.webp" alt="A waterfront home with a pool, palms, and a lawn along a canal on a bright day">
      <div class="cap"><h2>Real Estate</h2><span class="go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
    </a>
    <a class="tile" href="#" aria-label="Amazon Holiday Deals">
      <img src="assets/img/fe-theme-holiday-lights.webp" alt="Palm-lined walkway with holiday lights and red poinsettias on a sunny day">
      <div class="cap"><h2>Holiday Deals</h2><span class="go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
    </a>
  </nav>
</div>
</body>
</html>
